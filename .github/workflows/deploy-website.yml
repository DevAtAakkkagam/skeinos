name: Deploy website

# Publishes the static marketing site + privacy policy (website/) to GitHub Pages,
# served at https://skeinos.aakkagam.com. Pages is free for public repos and needs
# no secrets, which is why this replaced the Cloudflare Pages deploy when the repo
# went open source.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'extension/src/adapters/configs/*.json'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two site deploys race; cancel an in-flight one on a newer push.
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Adapter selector hot-fix channel: the extension's config loader polls
      # https://skeinos.aakkagam.com/adapters/<platform>.json when a platform is
      # degraded (adapters/runtime/loader.ts). Publish the configs from their
      # single source of truth so a selector fix ships by bumping configVersion
      # and pushing to main — no store release.
      #
      # This path is load-bearing for already-installed extensions: if it stops
      # serving, a site that changes its DOM stays broken until a store release.
      - name: Stage adapter configs
        run: |
          mkdir -p website/adapters
          for f in extension/src/adapters/configs/*.json; do
            jq -e . "$f" > /dev/null
            cp "$f" website/adapters/
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
