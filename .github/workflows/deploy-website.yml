name: Deploy website

# Publishes the static marketing site + privacy policy (website/) to the
# Cloudflare Pages project "skeinos" (served at https://skeinos.aakkagam.com).
# The Pages project is Direct Upload, so Wrangler uploads the folder — there is
# no Cloudflare-side git integration.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'extension/src/adapters/configs/*.json'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: {}

# Never let two site deploys race; cancel an in-flight one on a newer push.
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Adapter selector hot-fix channel: the extension's config loader polls
      # https://skeinos.aakkagam.com/adapters/<platform>.json when a platform is
      # degraded (adapters/runtime/loader.ts). Publish the configs from their
      # single source of truth so a selector fix ships by bumping configVersion
      # and pushing to main — no store release.
      - name: Stage adapter configs
        run: |
          mkdir -p website/adapters
          for f in extension/src/adapters/configs/*.json; do
            jq -e . "$f" > /dev/null
            cp "$f" website/adapters/
          done

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=skeinos --branch=main
