name: Deploy website

# Publishes the static marketing site + privacy policy (website/) to the
# Cloudflare Pages project "skeinos" (served at https://skeinos.aakkagam.com).
# The Pages project is Direct Upload, so Wrangler uploads the folder — there is
# no Cloudflare-side git integration.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: {}

# Never let two site deploys race; cancel an in-flight one on a newer push.
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=skeinos --branch=main
