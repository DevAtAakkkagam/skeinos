name: Publish extension

# Uploads a release build to the Chrome Web Store, Firefox AMO, and/or Edge
# Add-ons via publish-browser-extension (the tool behind `wxt submit`).
# Manual-only: run it from the Actions tab once the version bump is on main.
#
# It SUBMITS FOR REVIEW — store review still happens; Chrome auto-publishes
# after approval, AMO signs/reviews listed versions, Edge publishes after
# Partner Center certification. Store listing text (description / what's-new)
# is not touched — update that in the dashboards. Edge reuses the Chrome zip
# (same Chromium build).
#
# Required repo secrets (Chrome uses CWS API v2 with a Google Cloud
# service account — see extension/.env.submit.example):
#   Chrome : CHROME_EXTENSION_ID, CHROME_PUBLISHER_ID,
#            CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL,
#            CHROME_SERVICE_ACCOUNT_PRIVATE_KEY
#   Firefox: FIREFOX_EXTENSION_ID, FIREFOX_JWT_ISSUER, FIREFOX_JWT_SECRET
#   Edge   : EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY

on:
  workflow_dispatch:
    inputs:
      store:
        description: Which store(s) to publish to
        type: choice
        options: [all, chrome, firefox, edge]
        default: all
      dry-run:
        description: Validate credentials and package without uploading
        type: boolean
        default: false

# One publish at a time; never cancel an in-flight store upload.
concurrency:
  group: publish-extension
  cancel-in-progress: false

defaults:
  run:
    working-directory: extension

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Zip (Chrome/Edge)
        if: ${{ inputs.store != 'firefox' }}
        run: npm run zip

      - name: Check bundle budgets
        if: ${{ inputs.store != 'firefox' }}
        run: npm run check:size

      - name: Zip (Firefox + sources)
        if: ${{ inputs.store == 'all' || inputs.store == 'firefox' }}
        run: npm run zip:firefox

      - name: Submit to stores
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          STORE="${{ inputs.store }}"
          ARGS=""
          if [[ "$STORE" == "all" || "$STORE" == "chrome" ]]; then
            ARGS="$ARGS --chrome-zip .output/skeinos-$VERSION-chrome.zip"
          fi
          if [[ "$STORE" == "all" || "$STORE" == "firefox" ]]; then
            ARGS="$ARGS --firefox-zip .output/skeinos-$VERSION-firefox.zip"
            ARGS="$ARGS --firefox-sources-zip .output/skeinos-$VERSION-sources.zip"
          fi
          if [[ "$STORE" == "all" || "$STORE" == "edge" ]]; then
            # Edge takes the same Chromium package as Chrome.
            ARGS="$ARGS --edge-zip .output/skeinos-$VERSION-chrome.zip"
          fi
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            ARGS="--dry-run $ARGS"
          fi
          # Call publish-browser-extension directly (same tool `wxt submit`
          # wraps): the copy pinned by wxt's lockfile (3.0.3) has a broken
          # ESM bundle that crashes on Node >= 22.
          npx -y publish-browser-extension@5 $ARGS

      - name: Changelog to run summary
        if: always()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## Store changelog for $VERSION"
            echo ""
            echo "Paste into the CWS description's WHAT'S NEW section (overwrite"
            echo "the previous one), the AMO version's release notes, and the"
            echo "Edge Partner Center submission's notes for certification:"
            echo ""
            echo '```'
            awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' ../CHANGELOG.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep release zips as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store-packages
          path: extension/.output/skeinos-*.zip
          # .output/ is a dot-directory; upload-artifact skips hidden paths
          # unless told otherwise.
          include-hidden-files: true
          retention-days: 90
